[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-foundry"
version = "0.1.0"
description = "Normalize, dedupe, score, export lead lists locally. Pluggable enrichment."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "@forgehk", email = "info@darkforgeai.com" }]
keywords = ["sales", "leads", "data-cleaning", "icp", "outreach"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business",
]
dependencies = [
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
lead-foundry = "lead_foundry.cli:main"

[tool.setuptools.packages.find]
include = ["lead_foundry*"]
